name: tests

on:
  push:
    branches: ["main"]
  pull_request:

# Superseded runs on the same branch/PR are just wasted CI minutes —
# this workflow has no side effects (it only runs pytest), so
# cancelling an in-progress run when a newer commit lands is safe,
# unlike dependency-check.yml.
concurrency:
  group: mini-dep-bot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: pytest tests/ -v
